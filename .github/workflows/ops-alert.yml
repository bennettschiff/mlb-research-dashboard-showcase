name: Ops alert (workflow failures)

# Watches every scheduled workflow and opens (or comments on) a GitHub issue
# when one fails. Motivation: the Drive backup sat broken+disabled for 11 days
# and HRR picks were silently zero for 10 — scheduled-job rot is invisible
# without an active alert. One open issue per workflow (deduped by title) so
# a flapping 30-min job can't flood the tracker.
#
# NOTE: new scheduled workflows must be added to the `workflows:` list below.

on:
  workflow_run:
    workflows:
      - "Nightly Supabase → Drive backup"
      - "Daily picks save + score"
      - "Morning score (yesterday's picks)"
      - "Cron pings (lineups + closing capture)"
      - "Closing odds snapshot + CLV"
      - "Plumbing tripwire (daily)"
      - "Uptime check"
    types: [completed]

permissions:
  issues: write
  actions: write   # needed for `gh run rerun` (auto-retry of transient infra failures)

jobs:
  alert:
    # 'cancelled' covers timeout-minutes kills — the daily-picks backstop timed
    # out silently for 3+ days (2026-06) because timeouts don't report 'failure'.
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ignore GitHub runner-starvation cancellations
        id: triage
        if: github.event.workflow_run.conclusion == 'cancelled'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # A 'cancelled' run means one of two very different things:
          #   1. A step exceeded timeout-minutes and GitHub killed it  → REAL failure, alert.
          #   2. GitHub never handed the job to a hosted runner        → infra noise, not ours.
          # Only case 2 carries the "not acquired by Runner" annotation. If EVERY
          # cancelled job in the run is annotated that way, suppress the false alert.
          # (The uptime */15 cron trips this periodically when GH runners are scarce.)
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion=="cancelled") | .id')
          if [ -z "$jobs" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          all_starved=1
          for j in $jobs; do
            msgs=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$j/annotations" \
              --jq '.[].message' 2>/dev/null || echo "")
            case "$msgs" in
              *"not acquired by Runner"*) : ;;   # this job never got a runner
              *) all_starved=0 ;;                # some other cancel reason → treat as real
            esac
          done
          if [ "$all_starved" = 1 ]; then
            echo "Runner-starvation cancellation — suppressing false alert."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-retry transient infra failures
        id: retry
        # Transient GitHub-infra failures ("Service Unavailable" resolving action
        # downloads, runner provisioning) die in "Set up job" BEFORE any of our steps
        # run, so in-job retry wrappers can't help — only a job-level rerun recovers
        # them, which is exactly what a human does by hand (observed 2026-07-13,
        # morning-score). Detect the known infra signatures and rerun ONCE, guarded by
        # run_attempt==1 so a genuinely-broken job can't loop. Our scheduled scripts are
        # idempotent, so a redundant rerun is a no-op ("Found 0 pending picks"). If the
        # rerun also fails it re-fires this workflow at run_attempt==2, where this step
        # is skipped and the run falls through to the alert below.
        #
        # 2026-08-19: this step was gated MORE NARROWLY than the job containing it
        # — the job admits failure/cancelled/timed_out, the step required
        # `failure` — so it was unreachable for the entire cancelled class. That
        # is not a corner case: a `timeout-minutes` kill reports `cancelled`, not
        # `failure` (verified on run 32162817636, whose only job concluded
        # `cancelled`), and three of the five INFRA signatures below — "not
        # acquired by Runner", "lost communication with the server", "received
        # the shutdown signal" — can ONLY ever appear on a cancelled run. They
        # could never have matched. The annotation scan had the same bug a second
        # time, selecting only `.conclusion=="failure"` jobs, so even with the
        # gate relaxed it would have collected nothing from a cancelled run.
        #
        # The gate is now just run_attempt + triage: the job-level `if:` already
        # decides which conclusions get here, and duplicating that decision in a
        # narrower form is exactly how the branch died. `--failed` reruns only
        # jobs that concluded `failure`, so a cancelled run needs the full rerun
        # form instead.
        if: >
          github.event.workflow_run.run_attempt == 1 &&
          steps.triage.outputs.skip != 'true'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # "has timed out after" is the timeout-minutes annotation. It is here
          # deliberately: a step hang is the exact class that lost the 2026-08-18
          # and 08-19 slates, every watched job is idempotent, and run_attempt
          # bounds it to one extra attempt. "The operation was canceled" is
          # deliberately NOT here — that also covers a human pressing Cancel, and
          # undoing a deliberate cancel is worse than not retrying.
          INFRA='Service Unavailable|Failed to resolve action download info|not acquired by Runner|lost communication with the server|received the shutdown signal|has timed out after'
          annos=""
          for j in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .id'); do
            annos+=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$j/annotations" \
              --jq '.[].message' 2>/dev/null || true)
            annos+=$'\n'
          done
          if echo "$annos" | grep -qE "$INFRA"; then
            echo "Transient infra failure detected ($CONCLUSION) — rerunning run $RUN_ID."
            if [ "$CONCLUSION" = "failure" ]; then
              gh run rerun "$RUN_ID" --failed
            else
              gh run rerun "$RUN_ID"
            fi
            echo "retried=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infra signature — leaving for immediate alert."
            echo "retried=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update failure issue
        if: steps.triage.outputs.skip != 'true' && steps.retry.outputs.retried != 'true'
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          TITLE="🚨 Scheduled workflow failing: $WF_NAME"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          BODY="[$WF_NAME]($RUN_URL) failed at $RUN_AT."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "$BODY

          Close this issue once the workflow is green again. Repeat failures will be added as comments here instead of new issues."
            echo "Opened new issue"
          fi
